repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
# The eslint package.json pins, from node_modules (`npm ci` once): Dependabot moves it in one place.
# The file itself, not npx: without node_modules, npx ran another eslint from its cache and passed.
- repo: local
  hooks:
  - id: eslint
    name: eslint (the version package.json pins; run npm ci once)
    entry: node node_modules/eslint/bin/eslint.js
    language: system
    files: \.(js|mjs|cjs)$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
