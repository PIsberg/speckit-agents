name: latest

# The test workflow's jobs on the newest Claude Code and the newest stable Node (#381). test.yml runs on the oldest Claude
# Code the team supports and on Node 22, the floor; users run the newest, whose hook events and fields are what the
# e2e tests pin. #280 (the permissionMode cases failing on 2.1.319) was found on a developer's machine, not by CI.
# Weekly and by hand, never required for a pull request. `latest` and '*' are a channel and a range, not versions,
# so nothing here is a second pin to move (test/versions.test.mjs). Not `current`: setup-node took it to a v27 alpha. A failed scheduled or manual run opens one issue,
# or comments on the open one. A pull request that changes this file runs it too, and files nothing. The board
# mod's type-check runs on these legs as on the pinned ones, after the live-board session laid the types (#399).
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/latest.yml

permissions:
  contents: read

concurrency:
  group: latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    uses: ./.github/workflows/test.yml
    with:
      claude-code: latest
      node-version: '*'

  report:
    needs: suite
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[P2] ci: the suite fails on the newest Claude Code or Node (latest.yml)'
          body="The weekly run of the test jobs on the newest Claude Code and the newest stable Node failed: $RUN_URL
          Read the failing job's log, tell a break in Claude Code or Node from a flaky test, and re-rank this issue."
          n=$(gh issue list --state open --search "in:title latest.yml" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
