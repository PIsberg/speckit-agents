name: full-run

# A whole /speckit-team run with real models (#46): tools/full-run.mjs builds a scratch Spec Kit repo
# from test/fixtures/full-run, runs the pipeline headless, and checks only what does not depend on the
# models' wording. Each run costs $2 to $4, so it never runs on push. It needs the ANTHROPIC_API_KEY
# secret and the FULL_RUN_ENABLED repository variable set to true; until then the job is skipped, not
# green. A fork's pull request never gets the secret, and no trigger that runs with the base
# repository's secrets is used to get around that.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "The main session's model (the agents keep their own model: lines)"
        default: sonnet
      max_cost:
        description: 'Fail the run above this many dollars'
        default: '6'
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: full-run
  cancel-in-progress: false

jobs:
  full-run:
    if: >-
      vars.FULL_RUN_ENABLED == 'true' && (github.event_name != 'pull_request' ||
      (github.event.label.name == 'e2e' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The version the test job pins: package.json's config.claudeCode.
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$(node -p "require('./package.json').config.claudeCode")"
      # Spec Kit's scripts in this checkout are its PowerShell ones; ubuntu-latest has pwsh.
      - run: claude --version && pwsh --version
      - name: Run /speckit-team on the fixture
        # The inputs go through the environment, never into the script's text.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model || 'sonnet' }}
          MAX_COST: ${{ inputs.max_cost || '6' }}
        run: node tools/full-run.mjs --out "$RUNNER_TEMP/full-run" --model "$MODEL" --max-cost "$MAX_COST"
      # The transcripts, the hook's records and run.json, to read a failed run off. The config dir
      # holds no key: Claude Code reads it from the environment.
      - name: Keep the run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-run
          path: |
            ${{ runner.temp }}/full-run/run.json
            ${{ runner.temp }}/full-run/cfg/projects/
            ${{ runner.temp }}/full-run/repo/.git/speckit-team/
            ${{ runner.temp }}/full-run/repo/specs/
          if-no-files-found: ignore
