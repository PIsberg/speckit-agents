<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1286" width="800" height="1286" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Drawn at 800 wide so GitHub's README column (about 830px) shows it near 1:1: keep text at 14 or more. -->
  <defs>
    <linearGradient id="bgL4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bgL3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bgL2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bgL1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc" letter-spacing="1">SPECKIT-AGENTS ARCHITECTURE</text>
  <text x="400" y="72" text-anchor="middle" font-size="15" fill="#94a3b8">Commands, agents, pipeline stages and the artifacts they produce</text>

  <!-- LAYER 4: COMMANDS -->
  <g transform="translate(24, 100)" filter="url(#shadow)">
    <rect width="752" height="248" rx="10" fill="#131127" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="-13" width="150" height="26" rx="4" fill="#6366f1"/>
    <text x="91" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">1. COMMANDS</text>

    <rect x="20" y="26" width="348" height="96" rx="8" fill="url(#bgL4)" stroke="#818cf8"/>
    <text x="38" y="56" font-size="17" font-weight="700" fill="#a5b4fc" font-family="monospace">/speckit-team &lt;idea&gt;</text>
    <text x="38" y="82" font-size="14" fill="#cbd5e1">• Runs the pipeline in the main session</text>
    <text x="38" y="104" font-size="14" fill="#cbd5e1">• Stops for your answers and sign-offs</text>

    <rect x="384" y="26" width="348" height="96" rx="8" fill="url(#bgL4)" stroke="#818cf8"/>
    <text x="402" y="56" font-size="17" font-weight="700" fill="#a5b4fc" font-family="monospace">/speckit-board</text>
    <text x="402" y="82" font-size="14" fill="#cbd5e1">• Status band and terminal pane</text>
    <text x="402" y="104" font-size="14" fill="#cbd5e1">• Phase track, agent timers, RED n/3</text>

    <rect x="20" y="134" width="348" height="96" rx="8" fill="url(#bgL4)" stroke="#818cf8"/>
    <text x="38" y="164" font-size="17" font-weight="700" fill="#a5b4fc" font-family="monospace">/speckit-patch &lt;change&gt;</text>
    <text x="38" y="190" font-size="14" fill="#cbd5e1">• One agent, 30 lines / 2 files</text>
    <text x="38" y="212" font-size="14" fill="#cbd5e1">• Protected paths denied; commits after end check</text>

    <rect x="384" y="134" width="348" height="96" rx="8" fill="url(#bgL4)" stroke="#818cf8"/>
    <text x="402" y="164" font-size="17" font-weight="700" fill="#a5b4fc" font-family="monospace">/speckit-triage</text>
    <text x="402" y="190" font-size="14" fill="#cbd5e1">• Suggests a track for your change</text>
    <text x="402" y="212" font-size="14" fill="#cbd5e1">• Advisory: runs nothing</text>
  </g>

  <path d="M 400 352 L 400 376" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- LAYER 3: AGENTS (pipeline order, left to right, top to bottom) -->
  <g transform="translate(24, 390)" filter="url(#shadow)">
    <rect width="752" height="428" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="-13" width="150" height="26" rx="4" fill="#0284c7"/>
    <text x="91" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">2. AGENTS</text>

    <g transform="translate(20, 28)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#475569"/>
      <rect width="226" height="30" rx="6" fill="#3b82f6"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">product-owner</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#93c5fd">Sonnet</text>
      <text x="14" y="78" font-size="14" fill="#94a3b8">Lane: specs/, feature.json</text>
      <text x="14" y="100" font-size="14" fill="#cbd5e1">Writes spec.md, asks you</text>
    </g>
    <g transform="translate(263, 28)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#475569"/>
      <rect width="226" height="30" rx="6" fill="#6366f1"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">architect</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#c7d2fe">Opus</text>
      <text x="14" y="78" font-size="14" fill="#94a3b8">Lane: specs/, CLAUDE.md</text>
      <text x="14" y="100" font-size="14" fill="#cbd5e1">Writes plan.md, tasks.md</text>
    </g>
    <g transform="translate(506, 28)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#ef4444" stroke-width="1.2"/>
      <rect width="226" height="30" rx="6" fill="#dc2626"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">spec-auditor</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#fca5a5">Opus</text>
      <text x="14" y="78" font-size="14" fill="#f87171">Lane: read-only</text>
      <text x="14" y="100" font-size="14" font-weight="700" fill="#fca5a5">VERDICT: PASS / FAIL</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#475569"/>
      <rect width="226" height="30" rx="6" fill="#0284c7"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">test-writer</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#93c5fd">Sonnet</text>
      <text x="14" y="78" font-size="14" fill="#94a3b8">Lane: test files only</text>
      <text x="14" y="100" font-size="14" fill="#cbd5e1">Failing tests: RED</text>
    </g>
    <g transform="translate(263, 160)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#475569"/>
      <rect width="226" height="30" rx="6" fill="#0d9488"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">implementer</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#99f6e4">Sonnet</text>
      <text x="14" y="78" font-size="14" fill="#94a3b8">Lane: src/ (no test files)</text>
      <text x="14" y="100" font-size="14" fill="#cbd5e1">Code until GREEN</text>
    </g>
    <g transform="translate(506, 160)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#10b981" stroke-width="1.2"/>
      <rect width="226" height="30" rx="6" fill="#059669"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">spec-gatekeeper</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#a7f3d0">Sonnet</text>
      <text x="14" y="78" font-size="14" fill="#6ee7b7">Lane: read-only</text>
      <text x="14" y="100" font-size="14" font-weight="700" fill="#a7f3d0">APPROVED / REJECTED</text>
    </g>
    <g transform="translate(20, 292)">
      <rect width="226" height="116" rx="6" fill="url(#bgL3)" stroke="#06b6d4" stroke-width="1.2"/>
      <rect width="226" height="30" rx="6" fill="#0891b2"/>
      <text x="113" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">patcher</text>
      <text x="113" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#a5f3fc">Sonnet</text>
      <text x="14" y="78" font-size="14" fill="#94a3b8">Lane: tree, not protected paths</text>
      <text x="14" y="100" font-size="14" fill="#a5f3fc">DONE / FAILED / ESCALATE</text>
    </g>
    <text x="263" y="326" font-size="14" fill="#94a3b8">patcher is the fast track's only agent: it stays within</text>
    <text x="263" y="348" font-size="14" fill="#94a3b8">30 lines / 2 files and never commits. The skill does,</text>
    <text x="263" y="370" font-size="14" fill="#94a3b8">from the accepted record, after the end check.</text>
  </g>

  <path d="M 400 818 L 400 842" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- LAYER 2: PIPELINE -->
  <g transform="translate(24, 856)" filter="url(#shadow)">
    <rect width="752" height="222" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="-13" width="150" height="26" rx="4" fill="#059669"/>
    <text x="91" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">3. PIPELINE</text>

    <!-- Stage boxes at x = 20 + 122 i, 100 wide -->
    <rect x="20" y="34" width="100" height="64" rx="6" fill="url(#bgL2)" stroke="#34d399"/>
    <text x="70" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SPECIFY</text>
    <text x="70" y="82" text-anchor="middle" font-size="14" fill="#a7f3d0">spec.md</text>
    <path d="M 120 66 L 138 66" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="142" y="34" width="100" height="64" rx="6" fill="url(#bgL2)" stroke="#34d399"/>
    <text x="192" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PLAN</text>
    <text x="192" y="82" text-anchor="middle" font-size="14" fill="#a7f3d0">plan, tasks</text>
    <path d="M 242 66 L 260 66" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="264" y="34" width="100" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="314" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#fca5a5">AUDIT</text>
    <text x="314" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">PASS / FAIL</text>
    <path d="M 364 66 L 382 66" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="386" y="34" width="100" height="64" rx="6" fill="url(#bgL2)" stroke="#34d399"/>
    <text x="436" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">RED</text>
    <text x="436" y="82" text-anchor="middle" font-size="14" fill="#a7f3d0">tests fail</text>
    <path d="M 486 66 L 504 66" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="508" y="34" width="100" height="64" rx="6" fill="url(#bgL2)" stroke="#34d399"/>
    <text x="558" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">GREEN</text>
    <text x="558" y="82" text-anchor="middle" font-size="14" fill="#a7f3d0">tests pass</text>
    <path d="M 608 66 L 626 66" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

    <rect x="630" y="34" width="100" height="64" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="680" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7b7">VERIFY</text>
    <text x="680" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">→ PR</text>

    <!-- Kick-backs -->
    <path d="M 314 98 L 314 124 L 192 124 L 192 102" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
    <text x="253" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#f87171">FAIL</text>
    <path d="M 558 98 L 558 156 L 192 156 L 192 124" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="436" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#f87171">3 REDs in a row</text>
    <text x="20" y="186" font-size="14" fill="#94a3b8">FAIL goes back to the architect; 3 REDs to the architect or you.</text>
    <text x="20" y="208" font-size="14" fill="#94a3b8">A PASS holds until constitution, spec, plan or tasks change (SHA-256).</text>
  </g>

  <path d="M 400 1078 L 400 1102" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- LAYER 1: ARTIFACTS -->
  <g transform="translate(24, 1116)" filter="url(#shadow)">
    <rect width="752" height="144" rx="10" fill="#111317" stroke="#64748b" stroke-width="1.5"/>
    <rect x="16" y="-13" width="150" height="26" rx="4" fill="#475569"/>
    <text x="91" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">4. ARTIFACTS</text>

    <g transform="translate(20, 28)">
      <rect width="166" height="96" rx="6" fill="url(#bgL1)" stroke="#cbd5e1"/>
      <path d="M 14 14 L 24 14 L 30 20 L 30 36 L 14 36 Z" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="38" y="31" font-size="16" font-weight="700" fill="#38bdf8" font-family="monospace">spec.md</text>
      <text x="14" y="62" font-size="14" fill="#cbd5e1">• Requirements</text>
      <text x="14" y="84" font-size="14" fill="#cbd5e1">• Your answers</text>
    </g>
    <g transform="translate(202, 28)">
      <rect width="166" height="96" rx="6" fill="url(#bgL1)" stroke="#cbd5e1"/>
      <path d="M 14 14 L 24 14 L 30 20 L 30 36 L 14 36 Z" fill="none" stroke="#818cf8" stroke-width="1.5"/>
      <text x="38" y="31" font-size="16" font-weight="700" fill="#818cf8" font-family="monospace">plan.md</text>
      <text x="14" y="62" font-size="14" fill="#cbd5e1">• Design, contracts</text>
      <text x="14" y="84" font-size="14" fill="#cbd5e1">• Data model</text>
    </g>
    <g transform="translate(384, 28)">
      <rect width="166" height="96" rx="6" fill="url(#bgL1)" stroke="#cbd5e1"/>
      <path d="M 14 14 L 24 14 L 30 20 L 30 36 L 14 36 Z" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="38" y="31" font-size="16" font-weight="700" fill="#a78bfa" font-family="monospace">tasks.md</text>
      <text x="14" y="62" font-size="14" fill="#cbd5e1">• Ordered slices</text>
      <text x="14" y="84" font-size="14" fill="#cbd5e1">• [P] side by side</text>
    </g>
    <g transform="translate(566, 28)">
      <rect width="166" height="96" rx="6" fill="url(#bgL1)" stroke="#34d399" stroke-width="1.2"/>
      <path d="M 14 14 L 24 14 L 30 20 L 30 36 L 14 36 Z" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="38" y="31" font-size="16" font-weight="700" fill="#34d399">Code + PR</text>
      <text x="14" y="62" font-size="14" fill="#cbd5e1">• Tests, red first</text>
      <text x="14" y="84" font-size="14" fill="#34d399">• Code, pull request</text>
    </g>
  </g>
</svg>
